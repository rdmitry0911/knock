<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101820"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Knock Control"><meta name="referrer" content="no-referrer"><title>Knock Control</title><link rel="stylesheet" href="style.css"><link rel="manifest" href="app.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><link rel="icon" href="icon.svg"></head>
<body class="mobile-app"><header><div class="brand"><img src="icon-48.png" width="28" height="28" alt=""><a id="open-full" href="app.html" target="_blank" rel="noopener"><span data-i18n="Open full view">Open full view</span></a></div><span class="eyebrow">KNOCK CONTROL</span><h1><span data-i18n="Server access">Server access</span></h1><p><span data-i18n="Import once. Then press ON.">Import once. Then press ON.</span></p></header><main>
<section id="import-panel"><h2><span data-i18n="Import profile">Import profile</span></h2><p data-mobile-only hidden><span data-i18n="Scan the server-issued QR or choose its image.">Scan the server-issued QR or choose its image.</span></p>
<p data-desktop-only><span data-i18n="Import a server-issued JSON profile.">Import a server-issued JSON profile.</span></p><div class="import-tools"><div class="actions" data-mobile-only hidden><button id="qr-start" type="button" class="primary"><span data-i18n="Scan with camera">Scan with camera</span></button><label class="file-button"><span data-i18n="QR image">QR image</span><input id="qr-image" type="file" accept="image/*"></label></div>
<div id="qr-camera" hidden><video id="qr-video" autoplay playsinline muted></video><button id="qr-stop" type="button"><span data-i18n="Close camera">Close camera</span></button></div>
<details id="import-details"><summary><span data-mobile-only hidden data-i18n="JSON file or QR text">JSON file or QR text</span><span data-desktop-only data-i18n="JSON profile">JSON profile</span></summary><label><span data-i18n="Profile file">Profile file</span><input id="import-file" type="file" accept=".json,application/json"></label><label><span data-mobile-only hidden data-i18n="QR link or JSON">QR link or JSON</span><span data-desktop-only data-i18n="JSON profile">JSON profile</span><textarea id="import-text" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Paste the server-issued link" data-i18n-placeholder="Paste the server-issued link"></textarea></label><button id="import-button" type="button"><span data-i18n="Import">Import</span></button></details></div></section>
<section id="control-panel" hidden><label><span data-i18n="Profile">Profile</span><select id="profiles"></select></label><p id="server" class="muted"></p>
<button id="open" class="on-button" type="button">ON</button><div class="actions"><button id="close" class="danger" type="button">OFF</button><button id="add-profile" type="button"><span data-i18n="Add profile">Add profile</span></button><button id="delete-profile" class="danger" type="button"><span data-i18n="Delete profile">Delete profile</span></button></div></section><p id="message" role="status" aria-live="polite"></p><p class="muted" id="install-hint"><span data-i18n="Add this page to your home screen for quick access.">Add this page to your home screen for quick access.</span></p></main>
<script src="vendor/jsQR.js"></script><script type="module" src="app.js"></script></body></html>
